<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bg: #f4ead9;
            --panel: #fdf8ef;
            --panel-2: #e3d3ba;
            --text: #3d2b1f;
            --text-muted: #8a7461;
            --accent: #b0824f;
            --accent-dim: #ecdec8;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image: radial-gradient(circle at 12% 15%, rgba(176, 130, 79, 0.12), transparent 40%),
            radial-gradient(circle at 88% 80%, rgba(176, 130, 79, 0.1), transparent 45%);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 640px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--panel-2);
            flex-shrink: 0;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--panel);
            border: 1.5px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            color: var(--accent);
            flex-shrink: 0;
            position: relative;
        }

        .avatar::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid var(--accent);
            opacity: 0;
            transition: opacity .3s;
        }

        .avatar.thinking::after {
            opacity: .5;
            animation: pulse 1.4s ease-out infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: .6;
            }
            100% {
                transform: scale(1.25);
                opacity: 0;
            }
        }

        header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.01em;
        }

        header p {
            margin: 2px 0 0;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 14.5px;
            line-height: 1.5;
            animation: fadeIn .25s ease;
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.bob {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--panel-2);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-bottom-right-radius: 4px;
            color: var(--text);
        }

        .msg.error {
            align-self: center;
            color: #ad5a4d;
            background: transparent;
            font-size: 13px;
        }

        form {
            display: flex;
            gap: 10px;
            padding: 16px 20px 20px;
            flex-shrink: 0;
            border-top: 1px solid var(--panel-2);
        }

        textarea {
            flex: 1;
            resize: none;
            background: var(--panel);
            border: 1px solid var(--panel-2);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 14.5px;
            padding: 11px 14px;
            height: 44px;
            max-height: 120px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: var(--panel);
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        @media (prefers-reduced-motion: reduce) {
            .msg, .avatar::after {
                animation: none;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <header>
        <div class="avatar" id="avatar">B</div>
        <div>
            <h1>BobAI</h1>
            <p>fine-tuned Llama 3.1</p>
        </div>
    </header>

    <div class="messages" id="messages">
        <div class="msg bob">Hey, I'm BobAI. Ask me anything.</div>
    </div>

    <form id="chat-form">
        <textarea id="input" placeholder="Message BobAI..." rows="1" required></textarea>
        <button type="submit" id="send-btn">Send</button>
    </form>
</div>

<script>
    const API_URL = ""; // coming soon

    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const messagesEl = document.getElementById('messages');
    const sendBtn = document.getElementById('send-btn');
    const avatar = document.getElementById('avatar');

    let history = []; // { role: "user" | "assistant", content: string }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    // grow the textarea a little as the user types
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMessage('user', text);
        history.push({role: 'user', content: text});
        input.value = '';
        input.style.height = 'auto';

        sendBtn.disabled = true;
        avatar.classList.add('thinking');
        const thinkingMsg = addMessage('bob', 'thinking…');

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text, history: history.slice(0, -1)})
            });

            if (!res.ok) throw new Error('Server responded with ' + res.status);

            const data = await res.json();
            thinkingMsg.textContent = data.response;
            history.push({role: 'assistant', content: data.response});

        } catch (err) {
            thinkingMsg.remove();
            addMessage('error', "Couldn't reach BobAI — is the Space awake? (" + err.message + ")");
        } finally {
            sendBtn.disabled = false;
            avatar.classList.remove('thinking');
            input.focus();
        }
    });
</script>

</body>
</html>
