<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobAI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4ead9;
            margin: 0;
            padding: 40px 20px;
        }

        #welcome {
            text-align: center;
            max-width: 400px ;
            margin: 0 auto;
            padding: 40px 20px;
        }

        #welcome-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: antiquewhite;
            border: 2px solid #b0824f;
            color: #b0824f;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            line-height: 66px;
            margin: 0 auto 15px auto;
        }

        #welcome h1 {
            font-size: 32px;
        }

        #welcome p {
            color: #6b5a48;
        }

        #welcome button {
            background-color: #b0824f;
            color: antiquewhite;
            border: none;
            padding: 12px 26px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        #github-link {
            margin-top: 25px;
            font-size: 13px;
        }

        #github-link a {
            color: #6b5a48;
        }

        #chat-app {
            display: none;
            max-width: 500px;
            margin: 0 auto;
            background-color: antiquewhite;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        #chat-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        #chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f4ead9;
            border: 2px solid #b0824f;
            color:#b0824f;
            font-weight: bold;
            text-align: center;
            line-height: 36px;
            float: left;
            margin-right: 10px;
        }

        #chat-header h2 {
            margin: 0;
            font-size: 16px;
        }

        #chat-header p {
            margin: 2px 0 0;
            font-size: 13px;
            color: #8a7461;
        }

        #messages {
            height: 350px;
            overflow-y: scroll;
            padding: 15px;
            clear: both;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
        }

        .bob-message {
            background-color: #f4ead9;
            border: 1px solid #b0824f;
        }

        .user-message {
            background-color: #b0824f;
            color: antiquewhite;
            margin-left: auto;
        }

        #chat-form{
            padding: 15px;
            border-top: 1px solid #eee;
        }

        #user-input {
            width: 70% ;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        #send-button {
            padding: 10px 18px;
            background-color: #b0824f;
            color: antiquewhite;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!--Welcome message-->
    <div id="welcome">
        <div id="welcome-avatar">B</div>
        <h1>Hey, I'm BobAI.</h1>
        <p>Ask me anything - jokes, questions, whatever's on your mind.</p>
        <button onclick="startChat()">Start chatting</button>
        <p id="github-link">
            <a href="https://github.com/oleksandr1dovbenko/BobAI" target="_blank">See the code on GitHub</a>
        </p>
    </div>

    <!--Chat, hidden until you press the button-->
    <div id="chat-app">
        <div id="chat-header">
            <div id="chat-avatar">B</div>
            <h2>BobAI</h2>
            <p>your friendly AI assistant</p>
        </div>
        <div id="messages">
            <div class="message bob-message">Hey, I'm BobAI. Ask me anything.</div>
        </div>
        <form id="chat-form" onsubmit="sendMessage(event)">
            <input type="text" id="user-input" placeholder="Type a message..." required>
            <button type="submit" id="send-button">Send</button>
        </form>
    </div>

    <script>
        var API_URL = "https://oleksandrdovbenko1.hackclub.app/chat";
        var chatHistory = [];

        function startChat() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('chat-app').style.display = 'block';
        }

        function sendMessage(event) {
            event.preventDefault();

            var input = document.getElementById('user-input');
            var messagesDiv = document.getElementById('messages');
            var userText = input.value.trim();

            if (!userText)
                return;

            messagesDiv.innerHTML += '<div class="message user-message">' + userText + '</div>';
            chatHistory.push({role: "user", content: userText});

            input.value = '';

            var thinkingMessage = document.createElement('div');
            thinkingMessage.className = 'message bob-message';
            thinkingMessage.textContent = 'Thinking...';
            messagesDiv.appendChild(thinkingMessage);

            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            fetch(API_URL, {
                method: 'POST',
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({message: userText, history: chatHistory})
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    thinkingMessage.textContent = data.response;
                    chatHistory.push({role: "assistant", content: data.response});
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                })
                .catch(function (error) {
                    thinkingMessage.textContent = "Sorry, something went wrong. Please try again.";
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                });
        }
    </script>
</body>
</html>
